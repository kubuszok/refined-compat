name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check-formatting:
    runs-on: ubuntu-latest
    name: Check formatting
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3.1.0
        with:
          apps: scalafmt
      - name: Check formatting
        run: scalafmt --check

  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v9
      - uses: coursier/setup-action@v3.1.0
        with:
          jvm: "temurin:1.17.0.15"
          apps: sbt
      - name: Make `sbt` run in the foreground (sbt 2 thin client starts a background server)
        shell: bash
        run: |
          dir="$RUNNER_TEMP/sbt-foreground"; mkdir -p "$dir"
          printf '#!/usr/bin/env bash\nexec "%s" --server "$@"\n' "$(command -v sbt)" > "$dir/sbt"
          chmod +x "$dir/sbt"; echo "$dir" >> "$GITHUB_PATH"
      - name: Compile, test all variations, and check binary compatibility
        # sbt 2.0: the bare `test` task is incremental/machine-cached (behaves like sbt 1.x's
        # `testQuick`), so a fresh CI run can vacuously pass with "No tests to run". `testFull`
        # forces a real run. `mima` checks binary compatibility against the last release.
        # sbt 2.0 needs the two commands semicolon-separated in one argument (bare
        # `sbt testFull mima` fails to parse: "Expected '/'").
        run: sbt "testFull ; mima"
